 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | Resilient Youth Voices (RYV)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ryvPurple: '#6B21A8', 
                        ryvYellow: '#FACC15', 
                        ryvOrange: '#FB923C', 
                        ryvLightGray: '#F3F4F6',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
        .form-glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #6B21A8 0%, #FB923C 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

    <!-- Registration Card -->
    <div class="w-full max-w-md transform transition-all hover:scale-[1.01]">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border-t-8 border-ryvYellow">
            
            <!-- Header Section -->
            <div class="p-8 text-center bg-ryvPurple text-white">
                <div class="flex justify-center mb-4">
                    <!-- Replace src with your actual logo path -->
                    <img src="logo.jpeg" alt="RYV Logo" class="w-16 h-16 rounded-full border-4 border-ryvYellow bg-white">
                </div>
                <h1 class="text-3xl font-bold">Join RYV</h1>
                <p class="text-ryvYellow mt-2 font-medium">"People United Under One Voice"</p>
            </div>

            <!-- Form Section -->
            <form id="registrationForm" class="p-8 space-y-6">
                
                <!-- Full Name Input -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-ryvPurple mb-1">Full Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="fullName" required 
                            class="w-full pl-10 pr-4 py-3 border-2 border-gray-100 rounded-xl focus:border-ryvPurple focus:ring-0 outline-none transition-all text-gray-700" 
                            placeholder="Enter your full name">
                    </div>
                </div>

                <!-- Email Input -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-ryvPurple mb-1">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required 
                            class="w-full pl-10 pr-4 py-3 border-2 border-gray-100 rounded-xl focus:border-ryvPurple focus:ring-0 outline-none transition-all text-gray-700" 
                            placeholder="email@example.com">
                    </div>
                </div>

                <!-- Role Selection (Optional) -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-ryvPurple mb-1">I want to join as a...</label>
                    <select id="role" class="w-full px-4 py-3 border-2 border-gray-100 rounded-xl focus:border-ryvPurple outline-none transition-all text-gray-700 bg-white">
                        <option value="member">General Member</option>
                        <option value="advocate">Peer Advocate</option>
                        <option value="volunteer">Volunteer</option>
                         <option value="ally">Ally</option>
                          <option value="AGYW"> AGYW</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" 
                    class="w-full bg-ryvOrange hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2">
                    <span>Register Now</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <!-- Footer Link -->
                <p class="text-center text-gray-500 text-sm mt-6">
                    Already a member? <a href="index.html" class="text-ryvPurple font-bold hover:underline">Return Home</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 hidden animate-bounce bg-ryvPurple text-white px-6 py-3 rounded-full shadow-2xl font-medium">
        Success! Welcome to the movement.
    </div>

    <script>
        const regForm = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');

        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Change button state to loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> Processing...`;

            const userData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value
            };

            try {
                const response = await fetch('https://ryv.onrender.com/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                const result = await response.json();

                if (response.ok) {
                    // Show success toast
                    toast.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Redirect to homepage
                    }, 3000);
                } else {
                    alert(result.error || "Something went wrong. Please try again.");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Register Now</span> <i class="fa-solid fa-arrow-right"></i>`;
                }

            } catch (error) {
                console.error("Error:", error);
                alert("Server is not running. Please start your Node.js server.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Register Now</span> <i class="fa-solid fa-arrow-right"></i>`;
            }
        });
    </script>
</body>
</html>
